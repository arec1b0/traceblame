# D1 (#19): 600 single-fault and clean traces, 450 faulted + 150 clean, collected by
# `make faults-d1 PLAN=d1` (#70). Nothing here is edited before a run; a change is a new plan
# revision and a new run. The numbers are starting values kept in config (CLAUDE.md hard rule 8).
#
# Split: calibration / test by source query, 50/50 per app, every fault kind within
# split.max_kind_deviation queries of half on the test side. The assignment of every query is in
# d1.queries.jsonl (generated by tools/faults/d1_queries.py, committed). #19 reports
# query-cluster bootstrap 95% CIs (resampling source queries, not traces) and flags every cell
# with n < 30 as indicative: the runbook-agent kinds have 12-13 test queries each.
seed: 19

agentic_rag:
  # CUAD queries: cuad.sample(n, seed, ratio), answerable ones whose golden chunks map and that
  # `exclude` does not list, the first `queries` of them. Every query runs clean; each kind
  # draws its count of them by its own seeded ranking (plan.plan), so every faulted trace has
  # the clean trace of its own query.
  n: 260
  ratio: 0.5
  queries: 110
  clean: 110
  counts:
    golden_context_removed: 75
    tool_failure: 75
    output_budget_exhausted: 75
    step_memory_loss: 75
    malformed_output: 50
    prompt_variant: 50

runbook_agent:
  # Fast sandbox scenarios only (crash tasks wait 7-11 min for their alert). One trace per task.
  # distinct: tasks with distinct (scenario, parameters) tuples, none of them a tuple of a task
  # in `exclude`; the split groups by that tuple, not by the task's name.
  scenarios: [latency, oom]
  per_scenario: 45
  distinct: true
  clean: 40
  counts:
    malformed_output: 25
    prompt_variant: 25
  approval_timeout_ms: 30000

# Queries this plan may not use: every candidate of the #14 validation run.
exclude: validation.queries.jsonl
# Every query of this plan with its split side and the kinds that drew it (ids only).
queries: d1.queries.jsonl

split:
  seed: 19
  max_kind_deviation: 2

loop:
  # As in validation.yaml: the loop signal and the #14 gate's threshold (reported, not gated,
  # for a D1 run).
  repeat_min: 3
  hit_rate_min: 0.6

settle_seconds: 300
assemble_seconds: 300
# A stored trace that is neither completed nor abandoned is attributed to an entry in flight
# when it started within that entry's window, widened by this much on both ends (clock skew
# between the host and the kind node).
orphan_slack_seconds: 5
