# Collector distribution image (issue #7): build, smoke-test, SBOM and Grype gate on every
# change; on main, push to GHCR and sign keylessly with the SBOM attested
# (sign-image.yml). Pull requests never get registry or signing permissions.
name: collector-image

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: collector-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, smoke, SBOM, Grype gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain (for the end-to-end smoke tests)
        run: bash scripts/install-tools.sh go
      - run: make collector-image
      - name: Upload the image SBOM and scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-image-sbom
          path: .security/otelcol-traceblame/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the image for publishing
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-image
          path: collector/_build/otelcol-traceblame.image.tar
          retention-days: 1

  publish:
    name: push to GHCR
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the image to GHCR
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collector-image
      - name: Push by commit SHA
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${OWNER,,}/traceblame-otelcol"
          docker load --input otelcol-traceblame.image.tar
          docker tag traceblame-otelcol:local "${image}:${SHA}"
          docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
          docker push "${image}:${SHA}"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${SHA}")"
          echo "image=${image}" >>"${GITHUB_OUTPUT}"
          echo "digest=${ref#*@}" >>"${GITHUB_OUTPUT}"

  sign:
    name: sign
    needs: publish
    permissions:
      id-token: write # Fulcio certificate from the GitHub OIDC token
      packages: write # push the signature and the SBOM attestation to GHCR
    # GitHub's `$/` self-repository form is the stricter reference, but actionlint 1.7.12 (the
    # latest release) rejects it for reusable workflow calls. Switch once actionlint accepts it.
    uses: ./.github/workflows/sign-image.yml # zizmor: ignore[self-repository]
    with:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
      sbom-artifact: collector-image-sbom
