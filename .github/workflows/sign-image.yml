# Keyless image signing (design §1.4: cosign keyless; verified at admission by Kyverno).
# Reusable: build workflows call it with the digest they pushed, and optionally the name of
# a workflow artifact holding the image SBOM (sbom.spdx.json), which is attested to the image
# as an SPDX predicate. First caller: collector-image.yml (issue #7).
name: sign-image

on:
  workflow_call:
    inputs:
      image:
        description: Image repository without tag or digest, e.g. ghcr.io/<owner>/traceblame-api
        required: true
        type: string
      digest:
        description: Image digest from the build job, sha256:<64 hex>
        required: true
        type: string
      sbom-artifact:
        description: Optional artifact of this run with sbom.spdx.json, attested to the image
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  sign:
    name: sign and verify
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # Fulcio certificate from the GitHub OIDC token
      packages: write # push the signature next to the image in GHCR
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
      SBOM_ARTIFACT: ${{ inputs.sbom-artifact }}
    steps:
      - name: Validate inputs
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad digest: ${DIGEST}" >&2; exit 1; }
          [[ "${IMAGE}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]] || { echo "bad image: ${IMAGE}" >&2; exit 1; }
          [[ "${SBOM_ARTIFACT}" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "bad artifact: ${SBOM_ARTIFACT}" >&2; exit 1; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: cosign login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
      - name: Sign by digest
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature identity
        # The certificate names this reusable workflow (job_workflow_ref) as the signer.
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/sign-image\.yml@refs/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
      - name: Download the SBOM
        if: inputs.sbom-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.sbom-artifact }}
          path: sbom
      - name: Attest the SBOM
        if: inputs.sbom-artifact != ''
        run: cosign attest --yes --type spdxjson --predicate sbom/sbom.spdx.json "${IMAGE}@${DIGEST}"
      - name: Verify the SBOM attestation identity
        if: inputs.sbom-artifact != ''
        run: |
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/sign-image\.yml@refs/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" >/dev/null
