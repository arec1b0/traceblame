# Run with `make lint` (pre-commit run --all-files). The only git hook is pre-push, which
# `make bootstrap` installs (`pre-commit install --hook-type pre-push`): it runs the
# pre-push stage only, the PR-state rule. Local hooks call the pinned tools from .tools/bin
# (tools/versions.env) and uv.lock, so every version has one source.
minimum_pre_commit_version: "4.7.0"
# Linters run in `make lint`, not on push.
default_stages: [pre-commit]
# Keep byte-identical: the verbatim design doc extract, the vendored semconv snapshot
# (SHA256SUMS) and the captured fixtures (fixture_sha256 in their provenance).
exclude: ^(docs/design\.md|schemas/semconv/|collector/testdata/fixtures/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # Their manifests also list pre-push: pinned to make lint, so a push runs only the
      # PR-state rule.
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
        # Kubernetes manifests hold several objects per file.
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --check --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: scripts/go-each-module.sh golangci-lint run ./...
        language: unsupported
        files: (\.go|go\.mod|go\.work)$
        pass_filenames: false
      - id: hadolint
        name: hadolint
        entry: .tools/bin/hadolint
        language: unsupported
        types: [dockerfile]
      - id: gitleaks
        name: gitleaks
        entry: .tools/bin/gitleaks dir --no-banner --redact .
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: prepush-pr-state
        name: PR state of the pushed branch (never push to a merged or closed PR)
        entry: scripts/prepush-check.sh
        language: unsupported
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: kubeconform
        name: kubeconform
        # Kubernetes objects of the kind cluster; CRDs (ClickHouseInstallation) have no schema.
        entry: .tools/bin/kubeconform -strict -summary -kubernetes-version 1.37.0 -ignore-missing-schemas
        language: unsupported
        files: ^deploy/kind/manifests/.*\.yaml$
      - id: actionlint
        name: actionlint
        entry: .tools/bin/actionlint
        language: unsupported
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: zizmor
        # Online audits run when GH_TOKEN is set (CI); offline audits always run.
        entry: uv run --frozen zizmor --min-severity=low
        language: unsupported
        files: ^\.github/workflows/.*\.ya?ml$
