# trace-assembler Deployment, 2 replicas (design §1.1): leader-free, partitions shared by leases
# in Postgres (ADR-0003). Every threshold is configuration (rule 8): the ConfigMap holds the
# starting hypotheses. ClickHouse and Postgres credentials come from Secrets generated by
# `make kind-up` / `make kind-deploy`, never committed. The image is built by
# `make kind-deploy` (services/assembler/Dockerfile).
apiVersion: v1
kind: ConfigMap
metadata:
  name: assembler-config
  namespace: traceblame
data:
  ASSEMBLER_PARTITIONS: "2"
  ASSEMBLER_GRACE: "5s"
  ASSEMBLER_POLL_INTERVAL: "2s"
  ASSEMBLER_MAX_WINDOW: "60s"
  ASSEMBLER_BATCH_SIZE: "500"
  ASSEMBLER_LEASE_TTL: "30s"
  ASSEMBLER_LOOKBACK: "48h"
  ASSEMBLER_INITIAL_LOOKBACK: "48h"
  ASSEMBLER_DUPLICATE_WINDOW: "1h"
  ASSEMBLER_STREAM_MAX_AGE: "168h"
  ASSEMBLER_STREAM_REPLICAS: "1"
  ASSEMBLER_RECONCILE_EVERY: "10m"
  ASSEMBLER_RECONCILE_MARGIN: "5m"
  CLICKHOUSE_ADDR: clickhouse-traceblame.observability.svc:9000
  CLICKHOUSE_DATABASE: traceblame
  NATS_URL: nats://nats.observability.svc:4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-assembler
  namespace: traceblame
  labels:
    app: trace-assembler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trace-assembler
  template:
    metadata:
      labels:
        app: trace-assembler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: assembler
          image: traceblame-assembler:local
          imagePullPolicy: Never
          env:
            - name: ASSEMBLER_OWNER
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef: {name: assembler-clickhouse, key: user}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: assembler-clickhouse, key: password}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: user}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: password}
            - name: POSTGRES_DSN
              value: postgres://$(PGUSER):$(PGPASSWORD)@postgres.traceblame.svc:5432/traceblame?sslmode=disable
          envFrom:
            - configMapRef:
                name: assembler-config
          ports:
            - {name: metrics, containerPort: 9464}
          readinessProbe:
            httpGet: {path: /readyz, port: 9464}
          livenessProbe:
            httpGet: {path: /healthz, port: 9464}
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: trace-assembler
  namespace: traceblame
spec:
  selector:
    app: trace-assembler
  ports:
    - {name: metrics, port: 9464, targetPort: 9464}
