# ClickHouse, 1 shard x 1 replica, through the Altinity operator (design §1.1). The image
# and the user's password hash come from tools/versions.env and the clickhouse-credentials
# Secret (generated by `make kind-up`, never committed); scripts/kind-deploy.sh substitutes
# ${CLICKHOUSE_IMAGE}. Storage is ephemeral: this is the local demo cluster.
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: traceblame
  namespace: observability
spec:
  defaults:
    templates:
      podTemplate: clickhouse
  configuration:
    users:
      traceblame/password_sha256_hex:
        valueFrom:
          secretKeyRef:
            name: clickhouse-credentials
            key: password_sha256_hex
      traceblame/networks/ip: "::/0"
      traceblame/profile: default
    clusters:
      - name: demo
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              image: ${CLICKHOUSE_IMAGE}
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  memory: 4Gi
