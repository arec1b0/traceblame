# Postgres for control-plane state (design §1.1): the trace-assembler's watermark and partition
# leases (ADR-0003); the replayer's replay_jobs later. One server in the demo cluster. The image
# comes from tools/versions.env (scripts/kind-deploy.sh substitutes ${POSTGRES_IMAGE}); the
# password from the postgres-credentials Secret (generated by `make kind-up`, never committed).
# The schema is applied by `traceblame-storage migrate` (ADR-0007). Storage is ephemeral.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: traceblame
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          env:
            - name: POSTGRES_DB
              value: traceblame
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: user}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: password}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d traceblame"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d traceblame"]
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: traceblame
spec:
  selector:
    app: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
# Only the trace-assembler reaches Postgres. `make kind-deploy` runs the migrations through
# `kubectl port-forward`, which goes through the kubelet and is not subject to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: traceblame
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: trace-assembler
      ports:
        - {protocol: TCP, port: 5432}
