# NATS JetStream for the events our own services publish with publish-ack (ADR-0003): here
# trace.completed. One server in the demo cluster (design §1.1 has 3 replicas); the stream is
# created by the trace-assembler with the duplicate window it relies on. The image comes from
# tools/versions.env; scripts/kind-deploy.sh substitutes ${NATS_IMAGE}. Storage is ephemeral:
# this is the local demo cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: observability
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: nats
          image: ${NATS_IMAGE}
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: /healthz, port: 8222}
          livenessProbe:
            httpGet: {path: /healthz, port: 8222}
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: observability
spec:
  selector:
    app: nats
  ports:
    - {name: client, port: 4222, targetPort: 4222}
    - {name: monitor, port: 8222, targetPort: 8222}
---
# Only the trace-assembler (namespace traceblame) publishes; monitoring stays open for probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traceblame
          podSelector:
            matchLabels:
              app: trace-assembler
      ports:
        - {protocol: TCP, port: 4222}
    - ports:
        - {protocol: TCP, port: 8222}
