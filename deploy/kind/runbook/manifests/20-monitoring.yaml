# kube-state-metrics, Prometheus, Alertmanager and blackbox_exporter for the sandbox (#13).
# Images are pinned in tools/versions.env and filled in by scripts/kind-runbook.sh; the
# configuration files are deploy/kind/runbook/monitoring/, mounted as ConfigMaps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: runbook-monitoring
  labels: {app: kube-state-metrics}
spec:
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata:
      labels: {app: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: ${KUBE_STATE_METRICS_IMAGE}
          args: ["--namespaces=runbook-sandbox", "--resources=pods,deployments"]
          ports:
            - {name: metrics, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
          securityContext:
            # The image's user is `nobody` by name; runAsNonRoot needs the number.
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: runbook-monitoring
spec:
  selector: {app: kube-state-metrics}
  ports:
    - {name: metrics, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: runbook-monitoring
  labels: {app: prometheus}
spec:
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: ${PROMETHEUS_IMAGE}
          args:
            - --config.file=/etc/prometheus/config/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/config}
            - {name: rules, mountPath: /etc/prometheus/rules}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: rules
          configMap: {name: prometheus-rules}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: runbook-monitoring
spec:
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: runbook-monitoring
  labels: {app: alertmanager}
spec:
  selector: {matchLabels: {app: alertmanager}}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      serviceAccountName: alertmanager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: ${ALERTMANAGER_IMAGE}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
          ports:
            - {name: http, containerPort: 9093}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9093}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager}
            - {name: data, mountPath: /alertmanager}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: alertmanager-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: runbook-monitoring
spec:
  selector: {app: alertmanager}
  ports:
    - {name: http, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: runbook-monitoring
  labels: {app: blackbox-exporter}
spec:
  selector: {matchLabels: {app: blackbox-exporter}}
  template:
    metadata:
      labels: {app: blackbox-exporter}
    spec:
      serviceAccountName: blackbox-exporter
      containers:
        - name: blackbox-exporter
          image: ${BLACKBOX_EXPORTER_IMAGE}
          args: ["--config.file=/etc/blackbox/blackbox.yml"]
          ports:
            - {name: http, containerPort: 9115}
          readinessProbe:
            httpGet: {path: /-/healthy, port: 9115}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/blackbox}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: config
          configMap: {name: blackbox-config}
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: runbook-monitoring
spec:
  selector: {app: blackbox-exporter}
  ports:
    - {name: http, port: 9115, targetPort: 9115}
