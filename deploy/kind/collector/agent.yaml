# otel-agent (DaemonSet, design §1.1 component 3). Apps on the node send here; the agent
# authenticates them, normalizes (content stage before the queue, ADR-0002 section 4),
# stamps the tenant from the authenticated user (ADR-0005), then routes by trace id to the
# gateways over mTLS, buffering in a file-backed queue.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # One htpasswd user per tenant; generated by `make kind-up` into the tenants-htpasswd
  # Secret, never committed.
  basicauth/apps:
    htpasswd:
      file: /etc/otelcol/tenants/htpasswd
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: basicauth/apps
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: basicauth/apps

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  normalizer:
    tenant_source: auth
    tenant_auth_attribute: username
    # Tenants that may mark eval and fault-injection traces (#36, ADR-0005). One source for
    # both tiers: eval-tenants.env -> ConfigMap eval-tenants -> this variable, a YAML list.
    eval_tenants: ${env:TRACEBLAME_EVAL_TENANTS}

exporters:
  loadbalancing:
    routing_key: traceID
    protocol:
      otlp:
        timeout: 10s
        tls:
          ca_file: /etc/otelcol/tls/ca.crt
          cert_file: /etc/otelcol/tls/tls.crt
          key_file: /etc/otelcol/tls/tls.key
          # The resolver dials pod IPs; the gateway certificate names the Service.
          server_name_override: otel-gateway.observability.svc
    resolver:
      k8s:
        service: otel-gateway-headless.observability
        ports: [4317]
    # Resiliency option 1 (exporter README): re-route to the new ring after a gateway is
    # gone, and keep up to 512 MiB on disk while no gateway takes data (design §1.1).
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 536870912
      num_consumers: 10

service:
  extensions: [health_check, basicauth/apps, file_storage/queue]
  telemetry:
    logs:
      encoding: json
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, normalizer]
      exporters: [loadbalancing]
