# uv workspace root (virtual: not a package itself).
[tool.uv]
required-version = "==0.13.6"

[tool.uv.workspace]
members = [
    "services/api",
    "services/detectors",
    "services/attributor",
    "services/replayer",
    "packages/contracts",
    "packages/faults",
    "packages/storage",
    "sdk/python",
]

[dependency-groups]
dev = [
    "coverage==7.17.0",
    "nats-py==2.16.0",
    "openai==3.41.0",
    "pre-commit==4.7.0",
    "pyright[nodejs]==1.1.414",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "testcontainers==4.15.0",
    "types-pyyaml==6.0.12.20261030",
    "zizmor==1.31.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "S",            # bandit
    "SIM", "C4", "PT", "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["traceblame_*"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["services", "packages", "sdk", "tests", "tools", "bench"]
exclude = ["**/.venv", "**/__pycache__", ".tools"]
venvPath = "."
venv = ".venv"

# tools/: the capture scripts run as `uv run --script` in their own environments and add
# their sibling modules to sys.path at run time (cuad, rules, scenarios); extraPaths mirrors
# that. tools/typings holds stubs for what exists only in those environments (the PEP 723
# dependencies that conflict with the workspace's and the agentic-rag app); each says which
# release or commit it mirrors, and tests/scripts/test_tool_stubs.py checks the pins.
[[tool.pyright.executionEnvironments]]
root = "tools"
extraPaths = [
    "tools/fixtures",
    "tools/fixtures/agentic_rag",
    "tools/fixtures/runbook_agent",
    "tools/faults",
    "tools/typings",
]

# The tests of those modules import them by their run-time names (pytest pythonpath below).
# bench/gateway-scaling/assembler_report.py is imported the same way.
[[tool.pyright.executionEnvironments]]
root = "tests/scripts"
extraPaths = [
    "tools/fixtures",
    "tools/fixtures/agentic_rag",
    "tools/fixtures/runbook_agent",
    "tools/faults",
    "bench/gateway-scaling",
]

# The bench scripts run with the workspace environment (`uv run --frozen`).
[[tool.pyright.executionEnvironments]]
root = "bench"

[tool.pytest.ini_options]
minversion = "9.0"
# The capture drivers add these directories to sys.path at run time (rules, scenarios, cuad);
# tests/scripts imports those modules by the same names, and pyright's extraPaths match.
# bench/gateway-scaling holds assembler_report.py; tools/faults the fault drivers' modules.
pythonpath = [
    "tools/fixtures",
    "tools/fixtures/agentic_rag",
    "tools/fixtures/runbook_agent",
    "tools/faults",
    "bench/gateway-scaling",
]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
testpaths = ["services", "packages", "sdk", "tests"]
xfail_strict = true
markers = [
    "contract: contract tests (telemetry profile, JSON Schemas, golden fixtures)",
    "integration: needs Docker and a built collector (make integration)",
]

[tool.coverage.run]
branch = true
source_pkgs = [
    "traceblame_api",
    "traceblame_detectors",
    "traceblame_attributor",
    "traceblame_contracts",
    "traceblame_replayer",
    "traceblame_faults",
    "traceblame_storage",
    "traceblame_py",
]

[tool.coverage.report]
show_missing = true
