[project]
name = "traceblame-faults"
version = "0.1.0"
description = "TraceBlame faults: fault injection with ground-truth labels and seeds."
requires-python = ">=3.12,<3.13"
# The core (plan, scenarios, ledger, rewrites, wrappers) runs inside the apps' own environments
# too (the agentic-rag capture venv installs it with --no-deps): keep it to PyYAML.
dependencies = [
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# traceblame-faults record: the ledger into ClickHouse through the storage contract.
store = [
    "traceblame-storage",
]

[project.scripts]
traceblame-faults = "traceblame_faults.cli:main"

[tool.uv.sources]
traceblame-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
