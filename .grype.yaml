# Grype configuration for `make security` (scripts/security.sh).
#
# The gate is 0 critical vulnerabilities without a waiver (design §1.4). A waiver is an
# ignore rule whose reason says why it is acceptable and ends in "expires YYYY-MM-DD";
# scripts/security.sh fails on a waiver without an expiry or past it. Example:
#
# ignore:
#   - vulnerability: CVE-2026-00000
#     package:
#       name: example
#     reason: not reachable from TraceBlame code paths (see #NN); expires 2026-12-31
ignore:
  # x/crypto/openpgp is deprecated by design and will never get a fix. The distribution does
  # not build it: `go list -deps` of collector/_build/otelcol has no x/crypto/openpgp, and
  # govulncheck v1.9.0 (source mode) finds no reachable vulnerability. The module comes
  # in for other packages (configtls via go-tpm-keyfiles).
  - vulnerability: GO-2026-5932
    package:
      name: golang.org/x/crypto
    reason: openpgp is not in the collector build (go list -deps, govulncheck); re-check on every collector bump; expires 2027-01-31
