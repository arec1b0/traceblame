notes:
- Real faults in the runbook-sandbox namespace fire pinned upstream alert rules; Alertmanager posts each
  task's alert once to the agent.
- The agent runs in-cluster with a namespace-only Role, in live mode with its approval gate answered by
  a scripted approver through the app's own API.
- 'The image is the app''s Dockerfile at its commit, built from a context with the packed traceblame-ts:
  package.json names the tarball as an optional dependency, and the Dockerfile''s dependency COPY includes
  it.'
- 'Exported through traceblame-ts: AI SDK telemetry with recordInputs and recordOutputs off (ADR-0006).
  The file is what the tee collector received; the kind agent got the same requests.'
