# Mapping table: OTel GenAI semconv 1.30.0 -> aegis-telemetry/1 (ADR-0001).
# Format: ../README.md. Rows exist only for what a golden fixture shows.
sdk: otel-genai
version: 1.30.0
schema_version: 1.30.0
source: >-
  opentelemetry-instrumentation-openai-v2 2.4b0, default semconv mode
  (collector/testdata/fixtures/otel-genai/)
match:
  scopes: [opentelemetry.instrumentation.openai_v2, opentelemetry.util.genai.handler]

map:
  - to: gen_ai.provider.name
    from:
      - attr: gen_ai.system

  # The OpenAI client's errors read "Error code: NNN - <body>" (#29). Only that prefix is
  # read, and only a 100-599 status; the rest of the message is dropped as before (#9).
  - to: http.response.status_code
    from:
      - {status_message: true, on_error: true, match: '^(?:[A-Za-z_][A-Za-z0-9_.]*: )?Error code: ([0-9]{3})(?: - |$)', convert: http_status}
      - {event: exception, field: exception.message, on_error: true, match: '^(?:[A-Za-z_][A-Za-z0-9_.]*: )?Error code: ([0-9]{3})(?: - |$)', convert: http_status}

known:
  - gen_ai.request.temperature
  - gen_ai.request.seed
  - gen_ai.response.id
  - gen_ai.embeddings.dimension.count
  - server.port

# Content (issue #9). The profile forbids gen_ai.input.messages, gen_ai.output.messages,
# gen_ai.system_instructions and the other content attributes of semconv already; tool
# definitions are app-authored text, dropped like the other SDKs' (semconv v1.41.1).
content:
  - gen_ai.tool.definitions
