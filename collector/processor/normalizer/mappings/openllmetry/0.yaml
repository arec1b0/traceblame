# Mapping table: OpenLLMetry (Traceloop) conventions -> aegis-telemetry/1 (ADR-0001).
# Format: ../README.md. Rows exist only for what a golden fixture shows.
sdk: openllmetry
version: "0"
source: >-
  opentelemetry-instrumentation-openai 0.62.4 with opentelemetry-semantic-conventions-ai 0.5.1
  (collector/testdata/fixtures/openllmetry/); @traceloop/node-server-sdk 0.27.0 span processor
  over ai 4.3.19 telemetry (scope `ai`, the traceblame-ts shim)
match:
  # OpenLLMetry scopes share the opentelemetry.instrumentation. prefix with upstream
  # instrumentations, so only exact names are matched.
  scopes: [opentelemetry.instrumentation.openai.v1, ai]

# AI SDK spans: OpenLLMetry-js renames both the call and its HTTP attempt to "chat <model>"
# and sets no gen_ai.operation.name, so the AI SDK's own operation id names the kind. Python
# OpenLLMetry spans carry no ai.operationId and keep the profile's operation-based kind
# (OpenLLMetry 0.62 sets gen_ai.operation.name).
kind:
  from: ai.operationId
  values:
    ai.generateObject.doGenerate: {kind: llm, operation: chat}
  default: {kind: chain}

map:
  - to: gen_ai.response.finish_reasons
    from:
      # OpenLLMetry rewrites OpenAI's tool_calls to tool_call (fixture chat_tool_call).
      - attr: gen_ai.response.finish_reasons
        values: {tool_call: tool_calls}
  - to: server.address
    from:
      - attr: gen_ai.openai.api_base
        convert: url_host
        keep: true

  # The OpenAI client's errors read "Error code: NNN - <body>" (#29). Only that prefix is
  # read, and only a 100-599 status; the rest of the message is dropped as before (#9).
  - to: http.response.status_code
    from:
      - {status_message: true, on_error: true, match: '^(?:[A-Za-z_][A-Za-z0-9_.]*: )?Error code: ([0-9]{3})(?: - |$)', convert: http_status}
      - {event: exception, field: exception.message, on_error: true, match: '^(?:[A-Za-z_][A-Za-z0-9_.]*: )?Error code: ([0-9]{3})(?: - |$)', convert: http_status}

  # AI SDK errors are an exception event only (fixture runbook_api_error). The type is the
  # error's name (AI_APICallError, AI_NoObjectGeneratedError), without a module, so it needs
  # no class_name conversion (#29). Python OpenLLMetry sets error.type itself, which wins.
  - to: error.type
    from:
      - {event: exception, field: exception.type, on_error: true}

known:
  - gen_ai.request.temperature
  - gen_ai.response.id
  - gen_ai.usage.cache_read.input_tokens
  - gen_ai.is_streaming
  - gen_ai.openai.api_base
  - gen_ai.openai.response.system_fingerprint
  - gen_ai.usage.total_tokens
  # traceloop-node-server-sdk 0.27.0 over ai 4.3.19 (fixtures runbook_*)
  - ai.operationId
  - operation.name
  - ai.sdk.version
  - ai.response.timestamp
  - ai.settings.maxRetries
  - ai.settings.mode
  - ai.settings.output
  - gen_ai.system                      # deprecated; gen_ai.provider.name is set too
  - gen_ai.usage.prompt_tokens         # deprecated names the AI SDK sets in json mode;
  - gen_ai.usage.completion_tokens     # gen_ai.usage.input/output_tokens are set too

# Prompt/completion content (issue #9): dropped on every span, never mapped. Names from
# opentelemetry-semantic-conventions-ai 0.5.1 (SpanAttributes) and the *_content fixtures;
# gen_ai.input.messages / gen_ai.output.messages are forbidden by the profile already.
content:
  - gen_ai.tool.definitions
  - traceloop.entity.input
  - traceloop.entity.output
  - traceloop.prompt.template
  - traceloop.prompt.template_variables
  - gen_ai.content.completion.chunk
  - llm.content.completion.chunk
  - gen_ai.task.input
  - gen_ai.task.output
  - pattern: '^gen_ai\.(prompt|completion)\.'
  - pattern: '^llm\.request\.functions(\.|$)'
  # ai 4.3.19: everything gated by recordInputs/recordOutputs, plus app-authored text and
  # headers that are not gated.
  - ai.prompt
  - ai.prompt.format
  - ai.prompt.messages
  - ai.prompt.tools
  - ai.prompt.toolChoice
  - ai.schema
  - ai.schema.description
  - ai.response.object
  - ai.response.text
  - ai.response.toolCalls
  - ai.toolCall.args
  - ai.toolCall.result
  - ai.value
  - ai.values
  - ai.embedding
  - ai.embeddings
  - pattern: '^ai\.request\.headers\.'
  - pattern: '^ai\.telemetry\.metadata\.'
  - pattern: '^traceloop\.association\.properties\.'
